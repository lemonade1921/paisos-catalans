name: Compila l'APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Comprova si cal generar les dades
        id: dades
        run: |
          if [ -f app/src/main/assets/geo.json ]; then echo "cal=false" >> "$GITHUB_OUTPUT"; else echo "cal=true" >> "$GITHUB_OUTPUT"; fi

      # Si el repositori encara no té les dades dels mapes, les generem a partir d'OSM.
      - name: Recupera els extractes d'OSM
        if: steps.dades.outputs.cal == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .cache-osm
          key: osm-${{ hashFiles('tools/build_data.py') }}
          restore-keys: osm-

      - name: Python
        if: steps.dades.outputs.cal == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Genera les dades dels mapes
        if: steps.dades.outputs.cal == 'true'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
          pip install -r tools/requirements.txt
          python tools/build_data.py --cache .cache-osm

      - name: Escuts dels territoris (Wikidata / Wikimedia Commons)
        if: hashFiles('app/src/main/assets/escuts/escuts.json') == ''
        run: python3 tools/escuts.py

      - name: Desa els extractes d'OSM
        if: steps.dades.outputs.cal == 'true' && always()
        uses: actions/cache/save@v4
        with:
          path: .cache-osm
          key: osm-${{ hashFiles('tools/build_data.py') }}-${{ github.run_id }}

      - name: Puja les dades generades
        if: steps.dades.outputs.cal == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: geo-json
          path: app/src/main/assets/geo.json
          if-no-files-found: ignore

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Opcional: clau de signatura pròpia guardada com a secrets del repositori
      - name: Clau de signatura
        env:
          FITXER_B64: ${{ secrets.SIGNATURA_FITXER_B64 }}
        run: |
          if [ -n "$FITXER_B64" ]; then
            echo "$FITXER_B64" | base64 -d > "$RUNNER_TEMP/signatura.jks"
            echo "SIGNATURA_FITXER=$RUNNER_TEMP/signatura.jks" >> "$GITHUB_ENV"
          fi

      - name: Compila
        env:
          SIGNATURA_CONTRASENYA: ${{ secrets.SIGNATURA_CONTRASENYA }}
          SIGNATURA_ALIES: ${{ secrets.SIGNATURA_ALIES }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Mostra els errors de compilació
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          { sed -n '/issues were found/,/Run with/p' build.log | grep -E "Dependency|requires|compileSdk|AGP|minCompileSdk" | sort -u | head -24
            grep -E "^e: " build.log | head -40
            grep -E "What went wrong" -A 4 build.log | head -10; } > errors.txt || true
          # Cada línia, una anotació (GitHub en mostra un màxim de 10 per pas: agrupem)
          python3 - <<'EOF'
          lines = [l.rstrip() for l in open("errors.txt", encoding="utf-8", errors="replace")]
          for i in range(0, len(lines), 4):
              msg = "%0A".join(x.replace("%", "%25") for x in lines[i:i + 4])
              print(f"::error::{msg}")
          EOF

      - name: Puja l'APK
        uses: actions/upload-artifact@v4
        with:
          name: paisos-catalans-apk
          path: app/build/outputs/apk/release/*.apk

      # Quan es puja a main una versionName que encara no té versió publicada, es crea l'etiqueta
      # v<versionName> i la versió amb l'APK, i s'engeguen les captures de pantalla.
      - name: Publica la versió
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSIO="${GITHUB_REF_NAME}"
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            VERSIO="v$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
            if gh release view "$VERSIO" >/dev/null 2>&1; then
              echo "La versió $VERSIO ja està publicada."; exit 0
            fi
          else
            exit 0
          fi
          cp app/build/outputs/apk/release/*.apk "paisos-catalans-${VERSIO}.apk"
          NOTES=".github/notes/${VERSIO}.md"
          [ -f "$NOTES" ] || NOTES=/dev/null
          if gh release create "$VERSIO" "paisos-catalans-${VERSIO}.apk" --target "$GITHUB_SHA" \
               --title "Països Catalans ${VERSIO}" --notes-file "$NOTES" --latest; then
            echo "::notice title=Versió publicada::$VERSIO"
            gh workflow run captures.yml --ref main || echo "::warning::No s'han pogut engegar les captures"
          else
            gh release upload "$VERSIO" "paisos-catalans-${VERSIO}.apk" --clobber
          fi
