name: Compila l'APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Si el repositori encara no té les dades dels mapes, les generem a partir d'OSM.
      - name: Memòria cau de les descàrregues d'OSM
        if: hashFiles('app/src/main/assets/geo.json') == ''
        uses: actions/cache@v4
        with:
          path: .cache-osm
          key: osm-${{ hashFiles('tools/build_data.py') }}
          restore-keys: osm-

      - name: Python
        if: hashFiles('app/src/main/assets/geo.json') == ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Genera les dades dels mapes
        if: hashFiles('app/src/main/assets/geo.json') == ''
        run: |
          pip install -r tools/requirements.txt
          python tools/build_data.py --cache .cache-osm

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compila
        run: ./gradlew assembleRelease --stacktrace

      - name: Puja l'APK
        uses: actions/upload-artifact@v4
        with:
          name: paisos-catalans-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Puja les dades generades
        uses: actions/upload-artifact@v4
        with:
          name: geo-json
          path: app/src/main/assets/geo.json
          if-no-files-found: ignore
